<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Jost, 'Hk Grotesk', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5fd3bc"/>
    </marker>
  </defs>

  <!-- Agents -->
  <g>
    <rect x="30" y="40" width="250" height="110" rx="12" fill="#0d1f1c" stroke="#27b394" stroke-width="2"/>
    <text x="155" y="82" text-anchor="middle" font-size="24" fill="#f0e9f2">Agent 1</text>
    <text x="155" y="112" text-anchor="middle" font-size="17" fill="#c9c9cc">e.g. H₂ producer</text>
    <text x="155" y="136" text-anchor="middle" font-size="15" fill="#5fd3bc">own objective · own decisions</text>

    <rect x="30" y="175" width="250" height="110" rx="12" fill="#0d1f1c" stroke="#27b394" stroke-width="2"/>
    <text x="155" y="217" text-anchor="middle" font-size="24" fill="#f0e9f2">Agent 2</text>
    <text x="155" y="247" text-anchor="middle" font-size="17" fill="#c9c9cc">e.g. methanol / NH₃ plant</text>
    <text x="155" y="271" text-anchor="middle" font-size="15" fill="#5fd3bc">own objective · own decisions</text>

    <rect x="30" y="310" width="250" height="110" rx="12" fill="#0d1f1c" stroke="#27b394" stroke-width="2"/>
    <text x="155" y="352" text-anchor="middle" font-size="24" fill="#f0e9f2">Agent N</text>
    <text x="155" y="382" text-anchor="middle" font-size="17" fill="#c9c9cc">e.g. SAF / Fischer–Tropsch</text>
    <text x="155" y="406" text-anchor="middle" font-size="15" fill="#5fd3bc">own objective · own decisions</text>
  </g>

  <!-- Methods -->
  <g>
    <rect x="400" y="70" width="380" height="140" rx="12" fill="none" stroke="#e5e5e6" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="590" y="115" text-anchor="middle" font-size="26" fill="#f0e9f2">Game theory</text>
    <text x="590" y="148" text-anchor="middle" font-size="17" fill="#c9c9cc">strategic interaction between agents</text>
    <text x="590" y="174" text-anchor="middle" font-size="17" fill="#c9c9cc">mathematical optimization</text>

    <rect x="400" y="250" width="380" height="140" rx="12" fill="none" stroke="#e5e5e6" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="590" y="295" text-anchor="middle" font-size="26" fill="#f0e9f2">Reinforcement learning</text>
    <text x="590" y="328" text-anchor="middle" font-size="17" fill="#c9c9cc">distributed, decentralized agents</text>
    <text x="590" y="354" text-anchor="middle" font-size="17" fill="#c9c9cc">learning design policies</text>
  </g>

  <!-- Outcome -->
  <g>
    <rect x="900" y="140" width="270" height="180" rx="12" fill="#27b394" fill-opacity="0.16" stroke="#27b394" stroke-width="2"/>
    <text x="1035" y="195" text-anchor="middle" font-size="24" fill="#f0e9f2">Shared process</text>
    <text x="1035" y="225" text-anchor="middle" font-size="24" fill="#f0e9f2">network design</text>
    <text x="1035" y="262" text-anchor="middle" font-size="16" fill="#c9c9cc">capacities · technologies</text>
    <text x="1035" y="286" text-anchor="middle" font-size="16" fill="#c9c9cc">carriers · shared infrastructure</text>
  </g>

  <!-- arrows -->
  <g stroke="#5fd3bc" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M280 95 C340 95 340 140 398 140"/>
    <path d="M280 230 C340 230 340 175 398 175"/>
    <path d="M280 230 C340 230 340 290 398 290"/>
    <path d="M280 365 C340 365 340 320 398 320"/>
    <path d="M780 140 C840 140 840 210 898 210"/>
    <path d="M780 320 C840 320 840 250 898 250"/>
  </g>
</svg>
